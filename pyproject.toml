[project]
name = "claim-insurance-agent"
version = "0.1.0"
description = "Intelligent Claims Processing & Case Management Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.3.0,<2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "numpy>=1.26.0",
    "pytest>=8.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
