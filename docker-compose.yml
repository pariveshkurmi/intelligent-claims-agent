services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: claims-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-claims_db}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-claims_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: claims-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP port
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATA_FILE: ""

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: claims-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"   # Phoenix UI & Collector
    environment:
      PHOENIX_PORT: 6006
      PHOENIX_HOST: 0.0.0.0
      PHOENIX_ENABLE_AUTH: "false"

  adminer:
    image: adminer:latest
    container_name: claims-adminer
    restart: unless-stopped
    ports:
      - "5050:8080"   # Database Web Browser UI
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
